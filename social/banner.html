<!doctype html>
<!-- Viva Engage banner, 2400x900. social/render.py sets the background (a frame of the live app) and fills
     every [data-fig] from social/figures.js; nothing here is typed in by hand. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 2400px; height: 900px; overflow: hidden; background: #0b0a10; }
  .bg { position: absolute; inset: 0; background: center / cover no-repeat; }
  .shade { position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(8,7,12,.97) 0%, rgba(8,7,12,.94) 34%, rgba(8,7,12,.55) 46%, rgba(8,7,12,0) 56%); }
  /* Everything sits in the middle 40% (y 270-630), so a crop to 4:1 or tighter keeps it */
  .text { position: absolute; left: 150px; top: 270px; height: 360px; width: 1100px; display: flex; flex-direction: column; justify-content: center; font-family: 'Space Grotesk', sans-serif; color: #f6efe6; }
  .brand { font-size: 34px; font-weight: 600; display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .brand svg { width: 30px; height: 30px; }
  .brand b { color: #ff8a2a; font-weight: 600; }
  h1 { margin: 0; font-size: 100px; line-height: .98; font-weight: 700; letter-spacing: -.035em; }
  h1 span { background: linear-gradient(180deg, #ffe7b8, #ff8a2a 75%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin-top: 22px; font-size: 30px; color: #d9cbbd; }
  .sub b { color: #ffd28a; font-weight: 700; }
  .caption { margin-top: 14px; font-family: 'JetBrains Mono', monospace; font-size: 16px; letter-spacing: .06em; color: rgba(246,239,230,.5); }
</style></head>
<body>
  <div class="bg"></div><div class="shade"></div>
  <div class="text">
    <div class="brand"><svg viewBox="0 0 32 32"><path d="M16 2c2 6 9 9 9 17a9 9 0 0 1-18 0c0-4 2-6 4-8 0 3 1 5 3 5-1-5 0-10 2-14z" fill="#ff7a1f"/></svg><span>Ember<b>line</b></span></div>
    <h1>Of course.<br><span>I'll build that.</span></h1>
    <div class="sub"><b data-fig="fires"></b> Saskatchewan wildfires since <span data-fig="since"></span>, on a cinematic 3D map.</div>
    <div class="caption" data-fig="caption"></div>
  </div>
</body></html>
