<!doctype html>
<!-- LinkedIn cover, 1920x1080. social/render.py sets the background (a frame of the live app) and fills
     every [data-fig] from social/figures.js; nothing here is typed in by hand. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0b0a10; }
  .bg { position: absolute; inset: 0; background: center / cover no-repeat; }
  .shade { position: absolute; inset: 0;
    background:
      linear-gradient(90deg, rgba(8,7,12,.97) 0%, rgba(8,7,12,.95) 36%, rgba(8,7,12,.6) 50%, rgba(8,7,12,0) 62%),
      linear-gradient(0deg, rgba(8,7,12,.55) 0%, rgba(8,7,12,0) 22%); }
  .text { position: absolute; left: 120px; top: 0; bottom: 0; width: 900px; display: flex; flex-direction: column; justify-content: center; font-family: 'Space Grotesk', sans-serif; color: #f6efe6; }
  .brand { font-size: 40px; font-weight: 600; letter-spacing: .01em; display: flex; align-items: center; gap: 14px; margin-bottom: 54px; }
  .brand svg { width: 34px; height: 34px; }
  .brand b { color: #ff8a2a; font-weight: 600; }
  h1 { margin: 0; font-size: 128px; line-height: .98; font-weight: 700; letter-spacing: -.035em; }
  h1 span { background: linear-gradient(180deg, #ffe7b8, #ff8a2a 75%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin-top: 40px; font-size: 36px; line-height: 1.3; color: #d9cbbd; max-width: 760px; }
  .stats { margin-top: 56px; display: flex; gap: 56px; }
  .stat b { display: block; font-size: 58px; font-weight: 700; color: #ffd28a; letter-spacing: -.02em; }
  .stat i { font-style: normal; font-family: 'JetBrains Mono', monospace; font-size: 18px; letter-spacing: .14em; text-transform: uppercase; color: #a8988a; }
  .caption { position: absolute; right: 48px; bottom: 34px; font-family: 'JetBrains Mono', monospace; font-size: 17px; letter-spacing: .06em; color: rgba(246,239,230,.62); }
</style></head>
<body>
  <div class="bg"></div><div class="shade"></div>
  <div class="text">
    <div class="brand"><svg viewBox="0 0 32 32"><path d="M16 2c2 6 9 9 9 17a9 9 0 0 1-18 0c0-4 2-6 4-8 0 3 1 5 3 5-1-5 0-10 2-14z" fill="#ff7a1f"/></svg><span>Ember<b>line</b></span></div>
    <h1>Of course.<br><span>I'll build that.</span></h1>
    <div class="sub">Every Saskatchewan wildfire since <span data-fig="since"></span>, on a cinematic 3D map.</div>
    <div class="stats">
      <div class="stat"><b data-fig="fires"></b><i>fires</i></div>
      <div class="stat"><b data-fig="range"></b><i>continuous record</i></div>
      <div class="stat"><b data-fig="hectares"></b><i>hectares burned</i></div>
    </div>
  </div>
  <div class="caption" data-fig="caption"></div>
</body></html>
